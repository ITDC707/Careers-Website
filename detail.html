<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企業詳細資訊</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* 內頁專屬的美化樣式 */
        .detail-container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #2a5298;
            text-decoration: none;
            font-weight: bold;
        }
        .detail-header {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .detail-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }
        .section-title {
            color: #1e3c72;
            border-left: 4px solid #2a5298;
            padding-left: 10px;
            margin-top: 30px;
            font-size: 1.3rem;
            margin-bottom: 15px;
        }
        .meta-info p {
            margin: 12px 0;
            line-height: 1.6;
            font-size: 1.05rem;
        }
        .meta-label {
            font-weight: bold;
            color: #1e3c72;
        }
        
        /* 職缺按鈕樣式 */
        .job-button {
            display: inline-block;
            background-color: #eef2f7;
            color: #1e3c72;
            padding: 10px 20px;
            border: 2px solid #2a5298;
            border-radius: 8px;
            margin: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .job-button:hover {
            background-color: #2a5298;
            color: white;
        }

        /* 🎯 補齊：功能強大的彈出視窗（Modal）樣式 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: none; /* 預設隱藏 */
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            position: relative;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
        }
        .close-modal-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }
        .close-modal-btn:hover { color: #333; }
        
        /* 福利列表樣式 */
        .benefits-list {
            padding-left: 20px;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <div class="detail-container">
        <a href="index.html" class="back-btn">← 返回企業列表</a>
        
        <div class="detail-header">
            <img id="comp-logo" src="" alt="Company Logo" class="detail-logo">
            <h1 id="comp-name">公司名稱載入中...</h1>
        </div>

        <div class="meta-info">
            <p><span class="meta-label">官方網站：</span><a id="comp-web" href="#" target="_blank">點擊前往</a></p>
            <p><span class="meta-label">語言要求：</span><span id="comp-lang">載入中...</span></p>
            <p><span class="meta-label">基本能力：</span><span id="comp-skill">載入中...</span></p>
            <p><span class="meta-label">境外生建議：</span><span id="comp-overseas">載入中...</span></p>
        </div>

        <h3 class="section-title">公司簡介</h3>
        <p id="comp-intro" style="line-height: 1.6; color: #555; white-space: pre-line;">載入中...</p>

        <h3 class="section-title">開放職缺 (點擊查看詳情)</h3>
        <div id="comp-jobs"></div>

        <h3 class="section-title">公司福利</h3>
        <ul id="comp-benefits" class="benefits-list"></ul>
    </div>

    <div id="jobModal" class="modal-overlay" onclick="closeModalOutside(event)">
        <div class="modal-content">
            <span class="close-modal-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-job-title" style="color: #1e3c72; margin-bottom: 15px;">職缺名稱</h2>
            <p id="modal-job-desc" style="line-height: 1.6; color: #555; white-space: pre-line;">職缺詳細描述載入中...</p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const compId = urlParams.get('id');

            if (!compId) {
                document.getElementById("comp-name").innerText = "未指定企業 ID";
                return;
            }

            try {
                // 讀取本地 data 資料夾內對應的 json
                const response = await fetch(`./data/${compId}.json`);
                
                if (!response.ok) {
                    throw new Error("找不到該企業的獨立資料檔案，請確認 data/ 資料夾內是否有該檔案。");
                }
                
                const currentCompany = await response.json();

                // 填入基本欄位資料
                document.getElementById("comp-name").innerText = currentCompany.name;
                document.getElementById("comp-logo").src = "./images/" + currentCompany.logo;
                document.getElementById("comp-intro").innerText = currentCompany.intro || "暫無簡介";
                document.getElementById("comp-web").href = currentCompany.website || "#";
                document.getElementById("comp-lang").innerText = currentCompany.langRequirement || "未特別註明";
                document.getElementById("comp-skill").innerText = currentCompany.basicSkill || "未特別註明";
                document.getElementById("comp-overseas").innerText = currentCompany.overseasAdvice || "未特別註明";

                // 🎯 核心修復：精準渲染職缺按鈕，防呆機制啟動
                const jobsContainer = document.getElementById("comp-jobs");
                jobsContainer.innerHTML = "";
                
                if (currentCompany.jobs && currentCompany.jobs.length > 0) {
                    currentCompany.jobs.forEach(job => {
                        const btn = document.createElement("button");
                        btn.className = "job-button";
                        
                        // 🎯 防呆：如果你的 job 只是純字串就直接用，如果是物件就讀取 title
                        const jobTitle = typeof job === 'object' ? (job.title || job.name) : job;
                        const jobDesc = typeof job === 'object' ? (job.desc || job.description || "歡迎對本職缺有興趣者投遞履歷！") : "歡迎對本職缺有興趣者投遞履歷！";
                        
                        btn.innerText = jobTitle;
                        
                        // 點擊按鈕彈出視窗
                        btn.onclick = () => {
                            document.getElementById("modal-job-title").innerText = jobTitle;
                            document.getElementById("modal-job-desc").innerText = jobDesc;
                            document.getElementById("jobModal").style.display = "flex";
                        };
                        jobsContainer.appendChild(btn);
                    });
                } else { 
                    jobsContainer.innerText = "目前暫無開放職缺"; 
                }

                // 渲染福利列表
                const benefitsContainer = document.getElementById("comp-benefits");
                benefitsContainer.innerHTML = "";
                if (currentCompany.benefits && currentCompany.benefits.length > 0) {
                    currentCompany.benefits.forEach(b => {
                        benefitsContainer.innerHTML += `<li>${b}</li>`;
                    });
                } else { 
                    benefitsContainer.innerHTML = "<li>基本勞健保</li>"; 
                }

            } catch (error) {
                console.error("內頁錯誤:", error);
                document.getElementById("comp-name").innerText = "找不到該企業資訊或資料尚未建檔";
                document.getElementById("comp-intro").innerHTML = `<span style="color:red;">錯誤原因：${error.message}</span><br><br>請確保本地電腦資料夾裡，真的有一個叫做 <b>data</b> 的資料夾，且裡面含有 <b>${compId}.json</b> 檔案！`;
            }
        });

        // 關閉視窗功能
        function closeModal() {
            document.getElementById("jobModal").style.display = "none";
        }

        // 點擊黑影處關閉
        function closeModalOutside(event) {
            const modal = document.getElementById("jobModal");
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
