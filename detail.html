<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企業詳細資訊</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .detail-container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #2a5298;
            text-decoration: none;
            font-weight: bold;
        }
        .detail-header {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .detail-logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }
        .section-title {
            color: #1e3c72;
            border-left: 4px solid #2a5298;
            padding-left: 10px;
            margin-top: 30px;
            font-size: 1.3rem;
            margin-bottom: 15px;
        }
        .meta-info p {
            margin: 12px 0;
            line-height: 1.6;
            font-size: 1.05rem;
        }
        .meta-label {
            font-weight: bold;
            color: #1e3c72;
        }
        
        /* 職缺按鈕樣式 */
        .job-button {
            display: inline-block;
            background-color: #eef2f7;
            color: #1e3c72;
            padding: 12px 24px;
            border: 2px solid #2a5298;
            border-radius: 8px;
            margin: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .job-button:hover {
            background-color: #2a5298;
            color: white;
        }

        /* 🎯 應徵方式區塊樣式 */
        .apply-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 25px;
            border-radius: 8px;
            margin-top: 35px;
        }
        .apply-btn {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(255,107,107,0.3);
            transition: all 0.2s ease;
            margin-top: 10px;
        }
        .apply-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255,107,107,0.4);
        }

        /* 彈出視窗（Modal）樣式 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: none; 
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 550px;
            width: 90%;
            position: relative;
            box-shadow: 0 5px 25px rgba(0,0,0,0.3);
        }
        .close-modal-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #999;
        }
        .close-modal-btn:hover { color: #333; }
    </style>
</head>
<body>

    <div class="detail-container">
        <a href="index.html" class="back-btn">← 返回企業列表</a>
        
        <div class="detail-header">
            <img id="comp-logo" src="" alt="Company Logo" class="detail-logo">
            <h1 id="comp-name">公司名稱載入中...</h1>
        </div>

        <div class="meta-info">
            <div id="row-web"><p><span class="meta-label">官方網站：</span><a id="comp-web" href="#" target="_blank">點擊前往</a></p></div>
            <div id="row-lang"><p><span class="meta-label">具備語言能力：</span><span id="comp-lang">載入中...</span></p></div>
            <div id="row-skill"><p><span class="meta-label">基礎能力需求：</span><span id="comp-skill">載入中...</span></p></div>
            <div id="row-overseas"><p><span class="meta-label">境外生建議：</span><span id="comp-overseas">載入中...</span></p></div>
        </div>

        <h3 class="section-title">公司簡介</h3>
        <p id="comp-intro" style="line-height: 1.7; color: #444; white-space: pre-line; text-align: justify;">載入中...</p>

        <h3 class="section-title">徵才職缺 (全職)</h3>
        <div id="comp-fulltime-jobs"></div>

        <h3 class="section-title">徵才職缺 (實習)</h3>
        <div id="comp-intern-jobs"></div>

        <!-- 💡 應徵方式區塊：預設隱藏，有職缺且有網址時才透過 JS 顯示 -->
        <div id="row-apply" class="apply-box" style="display: none;">
            <h3 style="color: #1e3c72; margin-top: 0; margin-bottom: 10px;">📩 應徵方式</h3>
            <p style="margin: 0; color: #555; line-height: 1.6;">
                請至 104 人力銀行投遞履歷，並於應徵時備註<strong>「中原大學校內徵才網上投遞」</strong>。
            </p>
            <a id="comp-apply-btn" href="#" target="_blank" class="apply-btn">前往 104 投遞履歷 →</a>
        </div>
    </div>

    <!-- 彈出視窗 HTML 結構 -->
    <div id="jobModal" class="modal-overlay" onclick="closeModalOutside(event)">
        <div class="modal-content">
            <span class="close-modal-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-job-title" style="color: #1e3c72; margin-bottom: 15px;">職缺名稱</h2>
            <p id="modal-job-desc" style="line-height: 1.6; color: #555; white-space: pre-line;">詳細內容載入中...</p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const compId = urlParams.get('id');

            if (!compId) {
                document.getElementById("comp-name").innerText = "未指定企業 ID";
                return;
            }

            try {
                const response = await fetch(`./data/${compId}.json`);
                if (!response.ok) {
                    throw new Error("找不到該企業的獨立資料檔案");
                }
                
                const currentCompany = await response.json();

                document.getElementById("comp-name").innerText = currentCompany.name;
                document.getElementById("comp-logo").src = "./images/" + currentCompany.logo;
                document.getElementById("comp-intro").innerText = currentCompany.intro || "暫無簡介";

                // 智慧欄位隱藏
                if (currentCompany.website && currentCompany.website.trim() !== "") {
                    document.getElementById("comp-web").href = currentCompany.website;
                    document.getElementById("row-web").style.display = "block";
                } else {
                    document.getElementById("row-web").style.display = "none";
                }

                if (currentCompany.langRequirement && currentCompany.langRequirement.trim() !== "") {
                    document.getElementById("comp-lang").innerText = currentCompany.langRequirement;
                    document.getElementById("row-lang").style.display = "block";
                } else {
                    document.getElementById("row-lang").style.display = "none";
                }

                if (currentCompany.basicSkill && currentCompany.basicSkill.trim() !== "") {
                    document.getElementById("comp-skill").innerText = currentCompany.basicSkill;
                    document.getElementById("row-skill").style.display = "block";
                } else {
                    document.getElementById("row-skill").style.display = "none";
                }

                if (currentCompany.overseasAdvice && currentCompany.overseasAdvice.trim() !== "") {
                    document.getElementById("comp-overseas").innerText = currentCompany.overseasAdvice;
                    document.getElementById("row-overseas").style.display = "block";
                } else {
                    document.getElementById("row-overseas").style.display = "none";
                }

                // 職缺容器與清空
                const fulltimeContainer = document.getElementById("comp-fulltime-jobs");
                const internContainer = document.getElementById("comp-intern-jobs");
                fulltimeContainer.innerHTML = ""; 
                internContainer.innerHTML = ""; 
                
                let hasJobs = false;

                if (currentCompany.jobs && currentCompany.jobs.length > 0) {
                    hasJobs = true;
                    currentCompany.jobs.forEach(job => {
                        const jobTitle = typeof job === 'object' ? (job.title || job.name) : job;
                        const jobDesc = typeof job === 'object' ? (job.desc || job.description) : "歡迎具備相關能力者前來投遞！";
                        
                        const btn = document.createElement("button");
                        btn.className = "job-button";
                        btn.innerText = jobTitle;
                        
                        btn.onclick = () => {
                            document.getElementById("modal-job-title").innerText = jobTitle;
                            document.getElementById("modal-job-desc").innerText = jobDesc;
                            document.getElementById("jobModal").style.display = "flex";
                        };

                        const lowerTitle = jobTitle.toLowerCase();
                        if (lowerTitle.includes("實習") || lowerTitle.includes("助理") || lowerTitle.includes("intern")) {
                            internContainer.appendChild(btn);
                        } else {
                            fulltimeContainer.appendChild(btn);
                        }
                    });
                }

                // 🎯 智慧應徵方式顯示邏輯：必須「有職缺」且「JSON 裡有提供 hrUrl 網址」才顯示
                const applyRow = document.getElementById("row-apply");
                if (hasJobs && currentCompany.hrUrl && currentCompany.hrUrl.trim() !== "") {
                    document.getElementById("comp-apply-btn").href = currentCompany.hrUrl;
                    applyRow.style.display = "block";
                } else {
                    applyRow.style.display = "none";
                }

            } catch (error) {
                console.error("內頁錯誤:", error);
                document.getElementById("comp-name").innerText = "找不到該企業資訊";
                document.getElementById("comp-intro").innerHTML = `<span style="color:red;">錯誤原因：${error.message}</span>`;
            }
        });

        function closeModal() {
            document.getElementById("jobModal").style.display = "none";
        }

        function closeModalOutside(event) {
            const modal = document.getElementById("jobModal");
            if (event.target === modal) {
                modal.style.display = "none";
            }
        }
    </script>
</body>
</html>
