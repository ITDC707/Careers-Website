<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企業詳細資訊</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        .detail-container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #2a5298;
            text-decoration: none;
            font-weight: bold;
        }
        .detail-header {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .detail-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }
        .section-title {
            color: #1e3c72;
            border-left: 4px solid #2a5298;
            padding-left: 10px;
            margin-top: 30px;
        }
        ul {
            padding-left: 20px;
            line-height: 1.8;
        }
        .job-tag {
            display: inline-block;
            background-color: #eef2f7;
            color: #1e3c72;
            padding: 5px 15px;
            border-radius: 6px;
            margin: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="detail-container">
        <a href="index.html" class="back-btn">← 返回企業列表</a>
        
        <div class="detail-header">
            <img id="comp-logo" src="" alt="Company Logo" class="detail-logo">
            <h1 id="comp-name">公司名稱載入中...</h1>
        </div>

        <h3 class="section-title">公司簡介</h3>
        <p id="comp-intro" style="line-height: 1.6; color: #555;">載入中...</p>

        <h3 class="section-title">開放職缺</h3>
        <div id="comp-jobs"></div>

        <h3 class="section-title">福利制度</h3>
        <ul id="comp-benefits"></ul>
    </div>

   <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // 從網址取得 id (例如：?id=usig)
            const urlParams = new URLSearchParams(window.location.search);
            const compId = urlParams.get('id');

            if (!compId) {
                document.getElementById("comp-name").innerText = "未指定企業 ID";
                return;
            }

            try {
                // 💡 核心改動：直接發送 fetch 請求去 data/ 資料夾抓取對應的 json 檔案！
                const response = await fetch(`./data/${compId}.json`);
                
                if (!response.ok) {
                    throw new Error("找不到該企業的獨立資料檔案");
                }
                
                // 解析單一公司的詳細資料
                const currentCompany = await response.json();

                // 把資料塞進 HTML 欄位中
                document.getElementById("comp-name").innerText = currentCompany.name;
                document.getElementById("comp-logo").src = "./images/" + currentCompany.logo;
                document.getElementById("comp-intro").innerText = currentCompany.intro || "暫無簡介";

                // 渲染職缺標籤
                const jobsContainer = document.getElementById("comp-jobs");
                jobsContainer.innerHTML = "";
                
                if (currentCompany.jobs && currentCompany.jobs.length > 0) {
                    currentCompany.jobs.forEach(job => {
                        // 💡 因為你 usig.json 裡的 jobs 格式是物件 [{title: "..."}]
                        // 這裡我們要取 job.title 才能正確顯示文字喔！
                        const jobTitle = typeof job === 'object' ? job.title : job;
                        jobsContainer.innerHTML += `<span class="job-tag">${jobTitle}</span>`;
                    });
                } else { 
                    jobsContainer.innerText = "目前暫無職缺"; 
                }

                // 渲染福利列表
                const benefitsContainer = document.getElementById("comp-benefits");
                benefitsContainer.innerHTML = "";
                if (currentCompany.benefits && currentCompany.benefits.length > 0) {
                    currentCompany.benefits.forEach(b => {
                        benefitsContainer.innerHTML += `<li>${b}</li>`;
                    });
                } else { 
                    benefitsContainer.innerHTML = "<li>基本勞健保與健全制度</li>"; 
                }
                
            } catch (error) {
                console.error("內頁載入錯誤:", error);
                document.getElementById("comp-name").innerText = "找不到該企業資訊";
                document.getElementById("comp-intro").innerText = "請確認 data/ 資料夾下是否有對應正確的 JSON 檔案。";
            }
        });
    </script>
</html>
