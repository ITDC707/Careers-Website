<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企業詳細資訊</title>
    <link rel="stylesheet" href="style.css"> 
    <style>
        /* 專屬於詳細頁面的簡單樣式 */
        .detail-container {
            max-width: 800px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            color: #2a5298;
            text-decoration: none;
            font-weight: bold;
        }
        .detail-header {
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 2px solid #eef2f7;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .detail-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }
        .section-title {
            color: #1e3c72;
            border-left: 4px solid #2a5298;
            padding-left: 10px;
            margin-top: 30px;
        }
        ul {
            padding-left: 20px;
            line-height: 1.8;
        }
        .job-tag {
            display: inline-block;
            background-color: #eef2f7;
            color: #1e3c72;
            padding: 5px 15px;
            border-radius: 6px;
            margin: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="detail-container">
        <a href="index.html" class="back-btn">← 返回企業列表</a>
        
        <div class="detail-header">
            <img id="comp-logo" src="" alt="Company Logo" class="detail-logo">
            <h1 id="comp-name">公司名稱載入中...</h1>
        </div>

        <h3 class="section-title">公司簡介</h3>
        <p id="comp-intro" style="line-height: 1.6; color: #555;">載入中...</p>

        <h3 class="section-title">開放職缺</h3>
        <div id="comp-jobs"></div>

        <h3 class="section-title">福利制度</h3>
        <ul id="comp-benefits"></ul>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // 1. 從網址取得 id (例如：?id=company-1 -> 拿到 company-1)
            const urlParams = new URLSearchParams(window.location.search);
            const compId = urlParams.get('id');

            // 2. 從 script.js 的函式中拿到那 8 家公司的完整資料
            const companiesList = window.getCompanyData();
            
            // 3. 找出目前點擊的是哪一家公司
            const currentCompany = companiesList.find(c => c.id === compId);

            if (currentCompany) {
                // 4. 把資料塞進 HTML 欄位中
                document.getElementById("comp-name").innerText = currentCompany.name;
                document.getElementById("comp-logo").src = "./images/" + currentCompany.logo;
                document.getElementById("comp-intro").innerText = currentCompany.intro || "暫無簡介";

                // 渲染職缺標籤
                const jobsContainer = document.getElementById("comp-jobs");
                jobsContainer.innerHTML = "";
                if(currentCompany.jobs) {
                    currentCompany.jobs.forEach(job => {
                        jobsContainer.innerHTML += `<span class="job-tag">${job}</span>`;
                    });
                } else { jobsContainer.innerText = "目前暫無職缺"; }

                // 渲染福利列表
                const benefitsContainer = document.getElementById("comp-benefits");
                benefitsContainer.innerHTML = "";
                if(currentCompany.benefits) {
                    currentCompany.benefits.forEach(b => {
                        benefitsContainer.innerHTML += `<li>${b}</li>`;
                    });
                } else { benefitsContainer.innerText = "<li>基本勞健保</li>"; }
                
            } else {
                // 如果找不到該公司
                document.getElementById("comp-name").innerText = "找不到該企業資訊";
            }
        });
    </script>
</body>
</html>
