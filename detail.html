<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>企業詳細資訊</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>

    <div class="detail-container">
        <a href="index.html" class="back-btn">← 返回企業列表</a>
        
        <div class="detail-header">
            <img id="comp-logo" src="" alt="Company Logo" class="detail-logo">
            <h1 id="comp-name">公司名稱載入中...</h1>
        </div>

        <div class="meta-info">
            <p><span class="meta-label">官方網站：</span><a id="comp-web" href="#" target="_blank">點擊前往</a></p>
            <p><span class="meta-label">語言要求：</span><span id="comp-lang">載入中...</span></p>
            <p><span class="meta-label">基本能力：</span><span id="comp-skill">載入中...</span></p>
            <p><span class="meta-label">境外生建議：</span><span id="comp-overseas">載入中...</span></p>
        </div>

        <h3 class="section-title">公司簡介</h3>
        <p id="comp-intro" style="line-height: 1.6; color: #555; white-space: pre-line;">載入中...</p>

        <h3 class="section-title">開放職缺</h3>
        <div id="comp-jobs"></div>
        
        <div id="debug-area" style="display: none;"></div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const rawId = urlParams.get('id') || '';
            const compId = rawId.trim().toLowerCase();

            if (!compId) {
                document.getElementById("comp-name").innerText = "網址上沒有帶入企業 ID";
                return;
            }

            const targetUrl = new URL(`./data/${compId}.json`, window.location.href).href;

            try {
                const response = await fetch(`./data/${compId}.json`);
                
                if (!response.ok) {
                    throw new Error(`HTTP 錯誤！狀態碼: ${response.status}`);
                }
                
                const currentCompany = await response.json();

                // 填入資料
                document.getElementById("comp-name").innerText = currentCompany.name || "未命名企業";
                document.getElementById("comp-logo").src = "images/" + (currentCompany.logo || "");
                document.getElementById("comp-intro").innerText = currentCompany.intro || "暫無簡介";
                document.getElementById("comp-web").href = currentCompany.website || "#";
                document.getElementById("comp-lang").innerText = currentCompany.langRequirement || "未特別註明";
                document.getElementById("comp-skill").innerText = currentCompany.basicSkill || "未特別註明";
                document.getElementById("comp-overseas").innerText = currentCompany.overseasAdvice || "未特別註明";

                // 渲染職缺標籤
                const jobsContainer = document.getElementById("comp-jobs");
                jobsContainer.innerHTML = "";
                if (currentCompany.jobs && currentCompany.jobs.length > 0) {
                    currentCompany.jobs.forEach(job => {
                        const jobTitle = typeof job === 'object' ? (job.title || job.name) : job;
                        jobsContainer.innerHTML += `<span class="job-tag">${jobTitle}</span>`;
                    });
                } else { 
                    jobsContainer.innerText = "目前暫無職缺"; 
                }
                
            } catch (error) {
                console.error("內頁抓取錯誤:", error);
                document.getElementById("comp-name").innerText = "找不到該企業資訊";
                
                const debugArea = document.getElementById("debug-area");
                debugArea.style.display = "block";
                debugArea.innerHTML = `
                    <div class="debug-box">
                        <h3>🚨 系統健檢報告</h3>
                        <p><b>1. 網頁嘗試讀取的檔案路徑：</b><br>${targetUrl}</p>
                        <p><b>2. 錯誤訊息：</b> ${error.message}</p>
                        <p><b>💡 解決方法：</b> 你的本地電腦資料夾裡，目前確實沒有 <b>data/${compId}.json</b> 這個檔案！請在 VS Code 左側手動建立 <b>data</b> 資料夾，並在裡面塞入一個名為 <b>${compId}.json</b> 的檔案即可解決！</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
